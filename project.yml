name: OpenBooth
options:
  bundleIdPrefix: de.reingruber
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "2"
    SUPPORTS_MACCATALYST: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
# Signing-Team liegt lokal in Local.xcconfig (nicht im Repo), Vorlage: Local.xcconfig.example
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
targets:
  OpenBooth:
    type: application
    platform: iOS
    sources:
      - path: Sources/OpenBooth
    info:
      path: Sources/OpenBooth/Info.plist
      properties:
        CFBundleDisplayName: OpenBooth
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarHidden: true
        UIApplicationSupportsIndirectInputEvents: true
        # Documents-Ordner in der Dateien-App zeigen (Fotos, Logs, Warteschlangen)
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Pflicht fuer PTP-Passthrough ueber ImageCaptureCore auf iPadOS
        NSCameraUsageDescription: "OpenBooth steuert die per USB angeschlossene Kamera (Liveview und Ausloesen)."
        NSPhotoLibraryAddUsageDescription: "OpenBooth speichert die aufgenommenen Fotos in deine Mediathek."
        NSPhotoLibraryUsageDescription: "OpenBooth zeigt die aufgenommenen Fotos in der Galerie."
        NSLocalNetworkUsageDescription: "OpenBooth lädt Fotos auf Server im lokalen Netz hoch und bietet dort eine Statusseite an."
        NSBonjourServices: ["_http._tcp"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.reingruber.openbooth
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SWIFT_STRICT_CONCURRENCY: minimal
